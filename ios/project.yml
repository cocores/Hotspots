name: Hotspots
options:
  bundleIdPrefix: com.cocores
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 10.29.0

targets:
  Hotspots:
    type: application
    platform: iOS
    sources:
      - path: Hotspots
        excludes:
          - "**/*.md"
    resources:
      - path: Hotspots/GoogleService-Info.plist
        optional: true
    info:
      path: Hotspots/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSPhotoLibraryUsageDescription: "Hotspots needs access to your photo library so you can pick the image you want to annotate."
        NSPhotoLibraryAddUsageDescription: "Hotspots can save exported images back to your photo library."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cocores.hotspots
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_PREVIEWS: "YES"
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseStorage
    postCompileScripts: []

schemes:
  Hotspots:
    build:
      targets:
        Hotspots: all
    run:
      config: Debug
    archive:
      config: Release
